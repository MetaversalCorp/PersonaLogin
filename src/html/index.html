<html>
<head>
    <title>RP1 Demo Login Interface</title>
    <script src="https://cdn.persona.com/personasession.js"></script>
    <script src="https://cdn.persona.com/usersession.js"></script>
    <script src="https://cdn.persona.com/personapuppet.js"></script>
</head>
<body>
    <h1>Welcome to RP1 Demo Login Interface</h1>
    <div id="login">
        <form id="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit">Login</button>
        </form>
    </div>
    <script>
        const personaSession = new PersonaSession();
        const userSession = new UserSession();
        const personaPuppet = new PersonaPuppet();

        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (personaSession.isActive()) {
                userSession.login(username, password);
            } else {
                alert('No active Persona session!');
            }
        });
    </script>
</body>
</html>
