<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PersonaLogin</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: #0d1117;
        color: #c9d1d9;
        min-height: 100vh;
      }
      .card {
        background-color: #161b22;
        border: 1px solid #30363d;
      }
      .card-header {
        background-color: #21262d;
        border-bottom: 1px solid #30363d;
      }
      .form-control,
      .form-select {
        background-color: #0d1117;
        border-color: #30363d;
        color: #c9d1d9;
      }
      .form-control:focus,
      .form-select:focus {
        background-color: #0d1117;
        border-color: #58a6ff;
        color: #c9d1d9;
        box-shadow: 0 0 0 0.2rem rgba(88, 166, 255, 0.25);
      }
      #log-output {
        background-color: #0d1117;
        color: #56d364;
        font-family: "Consolas", "Monaco", monospace;
        font-size: 0.85rem;
        height: 300px;
        overflow-y: auto;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 0.75rem;
        white-space: pre-wrap;
      }
      .state-badge {
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <!-- Header -->
          <div class="d-flex align-items-center mb-4 gap-3">
            <h1 class="h4 mb-0 fw-bold text-white">PersonaLogin</h1>
            <span id="state-badge" class="badge bg-secondary state-badge">Disconnected</span>
          </div>

          <!-- Login Form -->
          <div class="card mb-3" id="login-card">
            <div class="card-header fw-semibold">Authentication</div>
            <div class="card-body">
              <form id="login-form">
                <div class="mb-3">
                  <label for="server-url" class="form-label">Server URL</label>
                  <input
                    type="url"
                    class="form-control"
                    id="server-url"
                    value="https://rp1.metaversalcorp.com"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    placeholder="your_username"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="••••••••"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="persona-id" class="form-label">Persona ID</label>
                  <input
                    type="text"
                    class="form-control"
                    id="persona-id"
                    placeholder="persona_abc123"
                    required
                  />
                </div>
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary" id="login-btn">
                    Login
                  </button>
                  <button type="button" class="btn btn-outline-danger" id="logout-btn" disabled>
                    Logout
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- World Controls (visible when InWorld) -->
          <div class="card mb-3 d-none" id="world-card">
            <div class="card-header fw-semibold">World Controls</div>
            <div class="card-body">
              <div class="row g-2 mb-3">
                <div class="col-sm-3">
                  <label for="pos-x" class="form-label">X</label>
                  <input type="number" class="form-control" id="pos-x" value="0" step="0.1" />
                </div>
                <div class="col-sm-3">
                  <label for="pos-y" class="form-label">Y</label>
                  <input type="number" class="form-control" id="pos-y" value="0" step="0.1" />
                </div>
                <div class="col-sm-3">
                  <label for="pos-z" class="form-label">Z</label>
                  <input type="number" class="form-control" id="pos-z" value="0" step="0.1" />
                </div>
                <div class="col-sm-3">
                  <label for="rot-y" class="form-label">Rot Y</label>
                  <input type="number" class="form-control" id="rot-y" value="0" step="1" />
                </div>
              </div>
              <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-sm btn-outline-primary" id="move-btn">
                  Move
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="anim-wave-btn">
                  Wave
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="anim-idle-btn">
                  Idle
                </button>
              </div>
            </div>
          </div>

          <!-- Transaction Log -->
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center fw-semibold">
              <span>Transaction Log</span>
              <button type="button" class="btn btn-sm btn-outline-secondary" id="clear-log-btn">
                Clear
              </button>
            </div>
            <div class="card-body p-2">
              <div id="log-output"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
