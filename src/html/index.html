<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Enter RP1</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }

        .card {
            background-color: #2C2C2C;
            border: none;
        }

        .btn {
            background-color: #007BFF;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center" style="height:100vh;">
        <div class="card p-4">
            <h3 class="text-center">Login to Enter RP1</h3>
            <form>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">Member Login</button>
                </div>
                <div class="form-group text-center">
                    <button type="button" class="btn btn-secondary" onclick="guestLogin()">Continue as Guest</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function guestLogin() {
            // Logic to handle guest login can be added here
            alert("Continuing as Guest...");
        }
    </script>

</body>

</html>
